name: EPUB Converter Factory

on:
  repository_dispatch:
    types: [convert_pdf, convert_web]

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (Pandoc & Tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils tesseract-ocr tesseract-ocr-ind

      - name: Install Python Libraries
        run: |
          pip install requests pymupdf beautifulsoup4 pytesseract pdf2image

      - name: Run Conversion Script
        env:
          EVENT_NAME: ${{ github.event.action }}
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python scripts/converter.py
